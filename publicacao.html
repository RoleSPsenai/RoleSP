<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicação</title>
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/publicacao.css" />
</head>

<body>
  <!-- Botao teste pra abrir a pagina de cadastro -->
  <button id="BotaoPublicar">Publicar</button>

  <!-- Aparecer na tela o pop up -->
  <dialog id="TelaPublicacao" class="popup">
    <div class="popup-content">
      <div class="mainPopup">
        <!-- div left -->
        <label class="imgLabel" for="imgInput">
          <input type="file" accept="image/*" id="imgInput">
          <img src="assets/img/icon/uploadImg.svg" alt="icone de upload de imagen" class="iconUpload">
          <span>Upload do local</span>
        </label>

        <!-- div right -->
        <div class="sectioInputs">
          <label for="optionsFilters"></label>
            <input type="checkbox" id="optionsFilters">
          
            <div id="selectButton">
              <div id="selectValue">Selecione o Filtro</div>
              <div id="icons">
                <img src="assets/img/icon/arrowdown.svg" alt="Icone de flecha apontando para baixo">
                <img src="assets/img/icon/arrowup.svg" alt="Icone de flecha apontando para cima">
              </div>
            </div>
        </div>
      </div>
    </div>
    </div>
  </dialog>
  <script src="script/publicacao.js"></script>
</body>

</html>
