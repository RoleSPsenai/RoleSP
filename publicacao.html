<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicação</title>
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/publicacao.css" />
</head>

<body>
  <!-- Botao teste pra abrir a pagina de cadastro -->
  <button id="BotaoPublicar">Publicar</button>

  <!-- Aparecer na tela o pop up -->
  <dialog id="TelaPublicacao" class="popup">
    <div class="popup-content">
      <div class="mainPopup">
        <!-- div left -->
        <label class="imgLabel" for="imgInput">
          <input type="file" accept="image/*" id="imgInput">
          <img src="assets/img/icon/uploadImg.svg" alt="icone de upload de imagen" class="iconUpload">
          <span>Upload do local</span>
        </label>

        <!-- div right -->
        <div class="sectioInputs">

          <div class="select">
            <label for="optionsFiltersLabel">
              <p class="title">Filtros</p>
            </label>
            <input type="checkbox" id="optionsFiltersLabel">

            <div id="selectButton">
              <div id="selectValue">Selecione o Filtro</div>
              <img src="assets/img/icon/arrowdown.svg" alt="Icone de flecha apontando para baixo" id="arrowdown">
              <img src="assets/img/icon/arrowup.svg" alt="Icone de flecha apontando para cima" id="arrowup">
            </div>
          </div>
          <ul class="filters">
            <li class="option">
              <input type="radio" name="category" value="cafeteria" data-lable="cafeteria">

              <img src="assets/img/filtrosIcones/Café.svg" alt="">
              <span class="label">Cafeteria</span>
              <img src="assets/img/filtrosIcones/Check cinza.svg" alt="" class="check">
            </li>

            <li class="option">
              <input type="radio" name="category" value="museu" data-lable="museu">

              <img src="assets/img/filtrosIcones/Museu.svg" alt="">
              <span class="label">Museu</span>
              <img src="assets/img/filtrosIcones/Check cinza.svg" alt="" class="check">
            </li>

            <li class="option">
              <input type="radio" name="category" value="restaurantes" data-lable="restaurantes">

              <img src="assets/img/filtrosIcones/Restaurante.svg" alt="">
              <span class="label">Restaurantes</span>
              <img src="assets/img/filtrosIcones/Check cinza.svg" alt="" class="check">
            </li>

            <li class="option">
              <input type="radio" name="category" value="natureza" data-lable="natureza">

              <img src="assets/img/filtrosIcones/Natureza.svg" alt="">
              <span class="label">Natureza</span>
              <img src="assets/img/filtrosIcones/Check cinza.svg" alt="" class="check">
            </li>

            <li class="option">
              <input type="radio" name="category" value="livraria" data-lable="livraria">

              <img src="assets/img/filtrosIcones/Livraria.svg" alt="">
              <span class="label">livraria</span>
              <img src="assets/img/filtrosIcones/Check cinza.svg" alt="" class="check">
            </li>

            <li class="option">
              <input type="radio" name="category" value="cultura" data-lable="cultura">

              <img src="assets/img/filtrosIcones/Cultura.svg" alt="">
              <span class="label">Cultura</span>
              <img src="assets/img/filtrosIcones/Check cinza.svg" alt="" class="check">
            </li>
          </ul>
          <label for="local" class="title">Local</label>
          <input type="text" placeholder="Nome do local..." class="inputs" id="local">
          <div id="groupInput">
            <div id="groupCep">
              <label for="inputCep" class="title">CEP</label>
              <input type="text" placeholder="CEP do local..." class="inputs" id="inputCep">
            </div>
            <div>
              <label for="bairro" class="title">Bairro</label>
              <input type="text" placeholder="Bairro do local..." class="inputs" id="bairro">
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </dialog>
  <script src="script/publicacao.js"></script>
</body>

</html>
