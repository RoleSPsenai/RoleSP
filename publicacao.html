<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicação</title>
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/publicacao.css" />
</head>

<body>
  <!-- Botao teste pra abrir a pagina de cadastro -->
  <button id="BotaoPublicar">Publicar</button>

  <!-- Aparecer na tela o pop up -->
  <dialog id="TelaPublicacao" class="popup">
    <div class="popup-content">
      <div class="mainPopup">
        <div class="left">
          <label class="imgLabel" for="imgInput">
            <input type="file" accept="image/*" id="imgInput">
            <img src="assets/img/uploadImg.svg" alt="icone de upload de imagen" class="iconUpload">
            <span>Upload do local</span>
          </label>
        </div>

        <div class="right">
          <input type="text">
        </div>
      </div>
    </div>
  </dialog>
  <script src="script/publicacao.js"></script>
</body>

</html>
