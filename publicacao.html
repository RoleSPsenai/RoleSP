<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicação</title>
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/publicacao.css" />
</head>

<body>
  <!-- Botao teste pra abrir a pagina de cadastro -->
  <button id="BotaoPublicar">Publicar</button>

  <!-- Aparecer na tela o pop up -->
  <dialog id="TelaPublicacao" class="popup">
    <div class="popup-content">
      <div class="mainPopup">
        <!-- div left -->
        <label class="imgLabel" for="imgInput">
          <input type="file" accept="image/*" id="imgInput">
          <img src="assets/img/icon/uploadImg.svg" alt="icone de upload de imagen" class="iconUpload">
          <span>Upload do local</span>
        </label>

        <!-- div right -->
        <div class="sectioInputs">
          <button id="btn-fechar" class="fechar-modal">
            <img src="assets/img/icon/Fechar.svg" alt="Fechar" class="sairImg"/>
          </button>
          <div class="select">
            <label for="local" class="title">Filtros</label>
            <select class="inputs">
              <option value="cafeteria">Cafeteria</option>
              <option value="museu">Museu</option>
              <option value="restaurantes">Restaurantes</option>
              <option value="natureza">Natureza</option>
              <option value="livraria">Livraria</option>
              <option value="cultura">Cultura</option>
            </select>
          </div>
          <div>
            <label for="local" class="title">Local</label>
            <input type="text" placeholder="Nome do local..." class="inputs" id="local">
            <div id="groupInput">
              <div id="groupCep">
                <label for="inputCep" class="title">CEP</label>
                <input type="text" placeholder="CEP do local..." class="inputs" id="inputCep">
              </div>
              <div id="groupBairro">
                <label for="bairro" class="title">Bairro</label>
                <input type="text" placeholder="Bairro do local..." class="inputs" id="bairro">
              </div>
            </div>
            <label for="rua" class="title">Rua:</label>
            <input type="text" placeholder="Rua do local..." class="inputs" id="rua">
            <label for="cidade" class="title">Cidade:</label>
            <input type="text" placeholder="Cidade do local..." class="inputs" id="cidade">
            <label for="comentario" class="title">Comentário:</label>
            <input type="text" placeholder="Digite seu Comentário..." class="inputs" id="comentario">
          </div>
          <button class="botao-publicar" id="BotaoPost">Publicar</button>
        </div>
      </div>
    </div>
    </div>
  </dialog>
  <script src="script/publicacao.js"></script>
</body>

</html>
